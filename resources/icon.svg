<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- No background: transparent canvas so the shape reads on light and dark themes. -->

  <defs>
    <!-- Neon glow: soft outer bloom used by the glowing stroke copies. -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>

    <!-- Front pane body: subtle glass fill so the pane has substance without a dark box. -->
    <linearGradient id="glassD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- Back pane (depth) — dim neon outline, softly glowing. -->
  <g transform="translate(276, 276) rotate(-12)">
    <rect x="-100" y="-130" width="200" height="260" rx="16"
          fill="none" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.35" filter="url(#glow)"/>
    <rect x="-100" y="-130" width="200" height="260" rx="16"
          fill="none" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.55"/>
  </g>

  <!-- Front pane (primary). -->
  <g transform="translate(240, 240) rotate(-12)">
    <!-- Outer neon bloom -->
    <rect x="-100" y="-130" width="200" height="260" rx="16"
          fill="none" stroke="#22D3EE" stroke-width="10" stroke-opacity="0.9" filter="url(#glow)"/>
    <!-- Glass body -->
    <rect x="-100" y="-130" width="200" height="260" rx="16" fill="url(#glassD)"/>
    <!-- Bright neon core stroke -->
    <rect x="-100" y="-130" width="200" height="260" rx="16"
          fill="none" stroke="#67E8F9" stroke-width="5"/>
    <!-- Reflection highlight -->
    <rect x="-86" y="-116" width="45" height="90" rx="10" fill="#ffffff" opacity="0.10"/>
  </g>
</svg>
