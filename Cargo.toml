[package]
name = "quickglass"
version = "1.0.0"
edition = "2024"
description = "QuickGlass - Lightweight markdown viewer for Windows"
license = "GPL-3.0-only"

[features]
default = []
# Dev-only startup timing log (%TEMP%\quickglass-startup.log). Off by default so
# release builds contain no timing code: `cargo build --release --features trace`.
trace = []

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false }

# Native Direct2D/DirectWrite renderer and the Win32 window (src/win.rs). All OS
# components, so this adds no runtime payload.
windows-numerics = "0.2.0"

[dependencies.windows]
version = "0.61.3"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Vendored pulldown-cmark 0.12.2 with one change: the HTML entity table is packed
# (concatenated strings + u16 offsets) instead of 2,125 fat-pointer pairs, saving
# ~54 KB. Same data and lookup results; see vendor/pulldown-cmark/mk_entities_packed.ps1.
[patch.crates-io]
pulldown-cmark = { path = "vendor/pulldown-cmark" }
