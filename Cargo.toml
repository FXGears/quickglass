[package]
name = "viewmd"
version = "0.10.1"
edition = "2024"
description = "ViewMD - Lightweight markdown viewer for Windows"
license = "GPL-3.0-only"

[features]
# Off by default: a stock release contains no native renderer at all — the module is
# not compiled and the Direct2D/DirectWrite bindings are not linked. Build with
# `--features beta_render` to include it, then select it at runtime with
# `--beta_render`.
default = []
beta_render = ["dep:windows", "dep:windows-numerics"]

[dependencies]
wry = "0.51"
tao = "0.33"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
png = "0.17"

# Native renderer (`--beta_render`), gated behind the `beta_render` feature. Direct2D
# and DirectWrite are OS components, so this adds no runtime payload. Version matches
# what tao/wry already resolve to, so no additional crate is pulled into the build.
windows-numerics = { version = "0.2.0", optional = true }

[dependencies.windows]
version = "0.61.3"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
