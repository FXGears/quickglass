[package]
name = "quickglass"
version = "0.11.0"
edition = "2024"
description = "QuickGlass - Lightweight markdown viewer for Windows"
license = "GPL-3.0-only"

[dependencies]
tao = "0.33"
pulldown-cmark = { version = "0.12", default-features = false }
png = "0.17"

# Native Direct2D/DirectWrite renderer. Both are OS components, so this adds no
# runtime payload. Version matches what tao already resolves to.
windows-numerics = "0.2.0"

[dependencies.windows]
version = "0.61.3"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
